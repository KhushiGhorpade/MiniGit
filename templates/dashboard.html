<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | MiniGit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="brand">
    <div class="logo"></div>
    <span>MiniGit</span>
  </div>
  <nav class="nav">
    <a href="#">Dashboard</a>
    <a href="#">Repositories</a>
    <a href="#">Activity</a>
    <a href="#">Logout</a>
  </nav>
</header>

<!-- DASHBOARD LAYOUT -->
<main class="dashboard">

  <!-- LEFT: LATEST REPOS -->
  <aside class="panel left-panel">
    <h3>Latest Repos</h3>
    <div class="panel-content">
      <p>repo-alpha</p>
      <p>minigit-core</p>
      <p>ui-dashboard</p>
      <p>auth-service</p>
    </div>
  </aside>

  <!-- CENTER: SEARCH + RESULTS -->
  <section class="center-panel">
    <div class="search-box">
      <input type="text" placeholder="Search repositories, users, commits...">
    </div>

    <div class="results-box">
      <p>Search results will appear here</p>
    </div>
  </section>

  <!-- RIGHT: LATEST COMMITS -->
  <aside class="panel right-panel">
    <h3>Latest Commits</h3>
    <div class="panel-content">
      <p>Fix auth bug</p>
      <p>Update README</p>
      <p>Refactor dashboard UI</p>
      <p>Optimize queries</p>
    </div>
  </aside>

</main>

</body>
</html>
