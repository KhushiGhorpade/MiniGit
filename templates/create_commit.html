<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Commit | MiniGit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/create_commit.css') }}">
</head>
<body>

<!-- ================= AUTH NAVBAR ================= -->
<header class="auth-header">
  <div class="auth-brand">
    <img src="{{ url_for('static', filename='/images/blue.png') }}" width="150px" height="150px">
  </div>

  <nav class="auth-nav">
    <a href="/dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/repositories" class="{% if active_page == 'repositories' %}active{% endif %}">Repositories</a>
    <a href="/activity" class="{% if active_page == 'activity' %}active{% endif %}">Activity</a>

    <!-- Create Dropdown -->
    <div class="dropdown">
      <span>Create ▾</span>
      <div class="dropdown-menu">
        <a href="/create-repo" class="{% if active_page == 'create-repo' %}active{% endif %}">New Repository</a>
        <a href="/create-issue" class="{% if active_page == 'create-issue' %}active{% endif %}">New Issue</a>
        <a href="/create-commit" class="{% if active_page == 'create-commit' %}active{% endif %}">New Commit</a>
      </div>
    </div>

    <!-- Profile Dropdown -->
    <div class="dropdown profile-dropdown">
      <span class="{% if active_page in ['profile', 'my-repos', 'activity'] %}active{% endif %}">Profile ▾</span>
      <div class="dropdown-menu">
        <a href="/profile" class="{% if active_page == 'profile' %}active{% endif %}">View Profile</a>
        <a href="/repositories" class="{% if active_page == 'my-repos' %}active{% endif %}">My Repositories</a>
        <a href="/activity" class="{% if active_page == 'activity' %}active{% endif %}">My Activity</a>
        <a href="/logout" class="logout">Logout</a>
      </div>
    </div>
  </nav>
</header>

<!-- ================= CREATE COMMIT SECTION ================= -->
<section class="commit-container">
  <div class="commit-card">
    <h1>Create New Commit</h1>
    <p class="subtitle">
      Commit your changes to a repository with a meaningful message
    </p>

    <form method="POST" action="/create-commit">

      <div class="form-group">
        <label>Repository <span style="color: #ff6b6b;">*</span></label>
        <select name="repo_id" required>
          <option value="">Select a repository</option>
          {% for repo in repositories %}
          <option value="{{ repo.repo_id }}">{{ repo.repo_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Commit Message <span style="color: #ff6b6b;">*</span></label>
        <input
          type="text"
          name="commit_message"
          placeholder="e.g. Fixed login bug, Added new feature, Updated README"
          required
        >
      </div>

      <div class="form-group">
        <label>Files Changed <span style="color: #ff6b6b;">*</span></label>
        <textarea
          name="files_changed"
          placeholder="List the files you changed or added (one per line)"
          required
        ></textarea>
        <small style="color: #88aaaa; display: block; margin-top: 5px;">Example: app.py, templates/index.html, static/css/style.css</small>
      </div>

      <div class="form-group">
        <label>Commit Type</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="commit_type" value="feature" checked>
            <span>Feature </span>
          </label>
          <label class="radio-label">
            <input type="radio" name="commit_type" value="bugfix">
            <span>Bugfix </span>
          </label>
          <label class="radio-label">
            <input type="radio" name="commit_type" value="documentation">
            <span>Documentation </span>
          </label>
          <label class="radio-label">
            <input type="radio" name="commit_type" value="other">
            <span>Other </span>
          </label>
        </div>
      </div>

      <button type="submit" class="create-btn">
        Create Commit
      </button>

    </form>
  </div>
</section>

</body>
</html>
