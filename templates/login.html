<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login | MiniGit</title>
  <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <img  src="{{ url_for('static', filename='/images/blue.png') }}" width="150px" height="150px"></div>
    </div>

    <nav class="nav">
      <a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}active{% endif %}">Home</a>
      <a href="{{ url_for('features') }}" class="{% if active_page == 'features' %}active{% endif %}">Features</a>
      <a href="{{ url_for('demo') }}" class="{% if active_page == 'demo' %}active{% endif %}">Demo</a>
      <a href="{{ url_for('privacy') }}" class="{% if active_page == 'privacy' %}active{% endif %}">Privacy</a>
      <a href="{{ url_for('help') }}" class="{% if active_page == 'help' %}active{% endif %}">Help</a>
      <a href="{{ url_for('feedback') }}" class="{% if active_page == 'feedback' %}active{% endif %}">Feedback</a>
    </nav>

    <a href="{{ url_for('login') }}" class="login">Login</a>

  </header>
  <!-- LOGIN FORM -->
  <div class="login-container">
    <div class="login-card">
      <h2>Login to MiniGit</h2>
      <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p>Don't have an account? <a href="/register" style="color: cyan; text-decoration: none;">Register</a></p>
    </div>
  </div>

</body>

</html>
