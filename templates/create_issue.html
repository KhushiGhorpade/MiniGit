<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Issue | MiniGit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/create_issue.css') }}">
</head>
<body>

<!-- ================= AUTH NAVBAR ================= -->
<header class="auth-header">
  <div class="auth-brand">
    <img  src="{{ url_for('static', filename='/images/blue.png') }}" width="150px" height="150px"></div>
  </div>

  <nav class="auth-nav">
    <a href="/dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/repositories" class="{% if active_page == 'repositories' %}active{% endif %}">Repositories</a>
    <a href="/activity" class="{% if active_page == 'activity' %}active{% endif %}">Activity</a>

    <!-- Create Dropdown -->
    <div class="dropdown">
      <span>Create ▾</span>
      <div class="dropdown-menu">
        <a href="/create-repo" class="{% if active_page == 'create-repo' %}active{% endif %}">New Repository</a>
        <a href="/create-issue" class="{% if active_page == 'create-issue' %}active{% endif %}">New Issue</a>
        <a href="/create-commit" class="{% if active_page == 'create-commit' %}active{% endif %}">New Commit</a>
      </div>
    </div>

    <!-- Profile Dropdown -->
    <div class="dropdown profile-dropdown">
      <span class="{% if active_page in ['profile', 'my-repos', 'activity'] %}active{% endif %}">Profile ▾</span>
      <div class="dropdown-menu">
        <a href="/profile" class="{% if active_page == 'profile' %}active{% endif %}">View Profile</a>
        <a href="/repositories" class="{% if active_page == 'my-repos' %}active{% endif %}">My Repositories</a>
        <a href="/activity" class="{% if active_page == 'activity' %}active{% endif %}">My Activity</a>
        <a href="/logout" class="logout">Logout</a>
      </div>
    </div>
  </nav>

</header>


<!-- ================= CREATE ISSUE SECTION ================= -->
<section class="issue-container">
  <div class="issue-card">
    <h1>Create New Issue</h1>
    <p class="subtitle">
      Report a bug or suggest an improvement for a repository
    </p>

    <form method="POST">

      <div class="form-group">
        <label>Repository</label>
        <select required>
          <option value="">Select repository</option>
          <option>mini-git</option>
          <option>demo-project</option>
        </select>
      </div>

      <div class="form-group">
        <label>Issue Title</label>
        <input
          type="text"
          placeholder="e.g. Login page not loading"
          required
        >
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea
          placeholder="Describe the issue in detail..."
          required
        ></textarea>
      </div>


      <button type="submit" class="create-btn">
        Create Issue
      </button>

    </form>
  </div>
</section>

</body>
</html>
